# Ambiente de desenvolvimento (docs/DEPLOYMENT.md §4).
#   docker compose up -d db          # só o PostgreSQL (go run local na porta 5432)
#   docker compose up --build        # banco + migrations + API em http://localhost:8080
# Variáveis: copie .env.example para .env (opcional; os padrões abaixo servem para dev).
name: blastgrid

x-api-env: &api-env
  BG_ENV: ${BG_ENV:-dev}
  BG_LOG_LEVEL: ${BG_LOG_LEVEL:-info}
  BG_LOG_FORMAT: ${BG_LOG_FORMAT:-json}
  BG_DATABASE_URL: postgres://${POSTGRES_USER:-blastgrid}:${POSTGRES_PASSWORD:-blastgrid_dev}@db:5432/${POSTGRES_DB:-blastgrid}?sslmode=disable
  BG_DB_MAX_CONNS: ${BG_DB_MAX_CONNS:-10}
  BG_DB_MIN_CONNS: ${BG_DB_MIN_CONNS:-1}
  BG_SHUTDOWN_TIMEOUT: ${BG_SHUTDOWN_TIMEOUT:-30s}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blastgrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blastgrid_dev}
      POSTGRES_DB: ${POSTGRES_DB:-blastgrid}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Só no loopback do host: o banco nunca fica exposto na rede.
      - "127.0.0.1:${BG_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Job único: aplica as migrations e sai. A API só sobe depois que ele termina com sucesso.
  migrate:
    image: blastgrid/api:dev
    build:
      context: ./server
      args:
        VERSION: ${BG_VERSION:-dev}
    command: ["migrate", "up"]
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: blastgrid/api:dev
    build:
      context: ./server
      args:
        VERSION: ${BG_VERSION:-dev}
    environment: *api-env
    ports:
      - "${BG_HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true
    # ≥ BG_SHUTDOWN_TIMEOUT para o graceful shutdown terminar (DEPLOYMENT.md §6).
    stop_grace_period: 35s
    restart: unless-stopped

volumes:
  pgdata:
